name: Gui hoa don tien tro tu dong

on:
  schedule:
    # 02:17 UTC = 09:17 Vietnam time. Schedule runs daily and only sends due, finalized bills.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chay thu, khong gui email that"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rent-invoice-mailer
  cancel-in-progress: false

jobs:
  send-invoices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      AUTO_EMAIL_ONLY_UNPAID: ${{ secrets.AUTO_EMAIL_ONLY_UNPAID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-email.txt
      - name: Install dependencies
        run: pip install -r requirements-email.txt
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
      - name: Dry run (manual test)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: python auto_email.py --dry-run
      - name: Send due invoices
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: python auto_email.py
